<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Box model</title>
    <link rel="stylesheet" href="stil.css" />
  </head>
  <body>
    <h1>CSS Box Model</h1>
    <div>Lorem ipsum</div>
    <h2>Width and height</h2>
    <h3>width %</h3>
    <div class="width1">Lorem ipsum -width1</div>
    <h3>width px</h3>
    <div class="width2">Lorem ipsum - width2</div>
    <h3>Lorem ipsum - height1</h3>
    <div class="height1">Lorem ipsum - height1</div>
    <h3>height %</h3>
    <div class="height2">
      <div class="height2blue">Lorem ipsum height</div>
    </div>
    <h3>height em</h3>
    <div class="height3">Lorem ipsum height em</div>
    <h2>Border</h2>
    <div class="width2 height2 border">Lorem ipsum border</div>
    <h3>border-width</h3>
    <div class="height2 border border-width">lorem ipsum</div>
  </body>
</html>
